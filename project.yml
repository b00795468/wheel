# Source of truth for the Xcode project. Regenerate with: xcodegen generate
name: Pivot
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    # Ad hoc signing ("Sign to Run Locally"), no team, no notarization.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # No sandbox, no hardened runtime: the app reads arbitrary files,
    # runs an embedded ffmpeg and monitors global events.
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    # Needed later by the Run Script phase that signs the embedded ffmpeg.
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Pivot:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_NAME: Pivot
        PRODUCT_BUNDLE_IDENTIFIER: local.pivot.app
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      # Copies the vendored ffmpeg into Contents/Resources/bin, drops the
      # quarantine flag and re-signs it with the app's identity (§3). Xcode
      # signs the app itself after every build phase.
      - name: Embed ffmpeg
        shell: /bin/bash
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Vendor/ffmpeg/ffmpeg
          - $(SRCROOT)/Vendor/ffmpeg/ffprobe
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/ffmpeg
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/ffprobe
        script: |
          set -euo pipefail
          BIN="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/bin"
          mkdir -p "$BIN"
          for tool in ffmpeg ffprobe; do
            SRC="$SRCROOT/Vendor/ffmpeg/$tool"
            if [ ! -x "$SRC" ]; then
              echo "error: $SRC manquant, lancer scripts/fetch-ffmpeg.sh"
              exit 1
            fi
            ditto "$SRC" "$BIN/$tool"
            xattr -d com.apple.quarantine "$BIN/$tool" 2>/dev/null || true
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --timestamp=none "$BIN/$tool"
          done
    scheme:
      testTargets: [PivotTests]

  # Hostless unit tests: the pure-logic sources are compiled straight into
  # the bundle, so running tests never launches the app (and its monitors).
  PivotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - App/DragMonitor/ModifierTapDetector.swift
      - App/Wheel/WheelModel.swift
      - App/Wheel/WheelGeometry.swift
      - App/Wheel/WheelView.swift
      - App/Theme.swift
      - App/Operations
      - App/Output/OutputLocator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pivot.tests
        GENERATE_INFOPLIST_FILE: YES
